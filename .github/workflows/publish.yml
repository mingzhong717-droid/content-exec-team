name: Publish to WeChat Draft

on:
  # API 触发（从 CatDesk 或任何地方调用）
  repository_dispatch:
    types: [publish]

  # 手动触发（GitHub 页面点 Run workflow）
  workflow_dispatch:
    inputs:
      km_url:
        description: "学城文章链接（km.sankuai.com/...）"
        required: true
        type: string

jobs:
  publish:
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~\AppData\Local\ms-playwright
          key: playwright-chromium-v1

      - name: Install dependencies
        run: pip install requests playwright
        shell: pwsh

      - name: Install Playwright browser (if not cached)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install chromium --with-deps
        shell: pwsh

      - name: Resolve km_url
        id: resolve
        run: |
          if ("${{ github.event_name }}" -eq "repository_dispatch") {
            echo "km_url=${{ github.event.client_payload.km_url }}" >> $env:GITHUB_OUTPUT
          } else {
            echo "km_url=${{ inputs.km_url }}" >> $env:GITHUB_OUTPUT
          }
        shell: pwsh

      - name: Run publish script
        env:
          WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
          WECHAT_APP_SECRET: ${{ secrets.WECHAT_APP_SECRET }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          KM_URL: ${{ steps.resolve.outputs.km_url }}
        run: python scripts/publish.py "$env:KM_URL"
        shell: pwsh

      - name: Upload cover image artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cover-preview
          path: ~\AppData\Local\Temp\cover_*.png
          if-no-files-found: ignore
          retention-days: 3
